permissions:
  contents: write
- name: Commit & Push
  run: |
    git config --global user.name 'github-actions'
    git config --global user.email 'actions@github.com'
    git add .
    git commit -m "Daily coffee log $(date)" || echo "No changes to commit"
    git push
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Daily Commit

on:
  schedule:
    - cron: '0 10 * * *'   # runs every day at 10:00 UTC (3:30 PM IST)
  workflow_dispatch:        # allows manual trigger too

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # allow pushing back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Make a change
        run: echo "☕ Brewed Latte on $(date)" >> daily_log.txt

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Daily coffee log $(date)" || echo "No changes to commit"
          git push
