name: Daily Commit

on:
  schedule:
    - cron: '0 10 * * *'   # runs every day at 10:00 UTC
  workflow_dispatch:        # allows manual trigger too

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Make a change
        run: echo "☕ Brewed Latte on $(date)" >> daily_log.txt

      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Daily coffee log $(date)"
          git push

